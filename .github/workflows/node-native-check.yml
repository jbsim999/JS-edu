name: node-native-check
on:
  push:
    branches: [main, 'feat/runtime-and-curriculum']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pinned-node-curriculum:
    name: native curriculum (${{ matrix.os }}, Node 24.22.0)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - run: npm run check:node
